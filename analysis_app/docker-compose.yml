version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - /opt/redis/data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    env_file:
      - .env
    restart: always

  django:
    build: .
    container_name: web-gate
    ports:
      - "5001:5001"
    depends_on:
      - redis
    env_file:
      - .env
    restart: always

