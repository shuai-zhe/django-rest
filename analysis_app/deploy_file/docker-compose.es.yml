# 独立的 Elasticsearch 部署文件
# 启动：docker compose -f docker-compose.es.yml up -d
# 关闭：docker compose -f docker-compose.es.yml down

services:
  elasticsearch:
    # 使用自定义 Dockerfile 构建的镜像，已内置 IK 中文分词插件（analysis-ik 8.13.4）
    build:
      context: .
      dockerfile: Dockerfile.es
    # 显式指定构建镜像名，避免 compose 用项目名(目录名)拼装镜像名时出现
    # invalid reference format（如目录名含下划线 docker_ -> docker_-elasticsearch）
    image: es-ik:8.13.4
    container_name: elasticsearch
    # 对外 REST API（Django 读写新闻数据走此端口）：宿主机 5001 -> 容器 9200
    ports:
      - "5001:9200"
    volumes:
      - /opt/elasticsearch/data:/usr/share/elasticsearch/data
      # 注意：不要挂载 plugins 目录到宿主，否则 bind mount 会遮盖镜像内置的
      # IK 插件（Dockerfile.es 已安装 analysis-ik 8.13.4 到镜像层），导致
      # analyzer [ik_max_word] not found。IK 以镜像为唯一可信源。
      # - /opt/elasticsearch/plugins:/usr/share/elasticsearch/plugins
    environment:
      # 单节点模式，适合开发/中小规模新闻存储
      discovery.type: single-node
      # 关闭安全认证，简化 Django 连调（生产环境建议开启并配置 TLS/密码）
      xpack.security.enabled: "false"
      # JVM 堆内存上限，按宿主机内存调整（建议不超过物理内存 50%）
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      # 监听所有网卡
      network.host: "0.0.0.0"
    # 调整系统限制，避免 "max virtual memory areas" 报错
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # 关闭 swap，保证 ES 性能
    privileged: true
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    # 可视化/索引管理界面：宿主机 8888 -> 容器 5601
    ports:
      - "8888:5601"
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      # 与 ES 保持一致，关闭安全
      XPACK_SECURITY_ENABLED: "false"
      # 界面语言设为简体中文
      I18N_LOCALE: "zh-CN"
    restart: always
