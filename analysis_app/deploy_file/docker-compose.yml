version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - /opt/mysql/data:/var/lib/mysql
      - /opt/mysql/conf:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    restart: always

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - /opt/redis/data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    env_file:
      - .env
    restart: always

  django:
    volumes:
      - /home/daima/logs:/logs
    build:
      dockerfile: deploy_file/Dockerfile
      context: ..
    container_name: web-gate
    ports:
      - "5001:5001"
    depends_on:
      - mysql
      - redis
    # 单机部署时保留，使容器能经本机网关访问宿主机映射端口（如 ES 5001）
    # 跨机器部署时此映射无害，可保留；实际连哪个 ES 由下方 ES_HOST 决定
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ES 地址：默认连本机（单机部署）；跨机器时在 .env 配置为 ES 所在机器的 IP/域名
      ES_HOST: ${ES_HOST:-host.docker.internal}
      # 跨机器部署时填 ES 机器映射出的端口（默认 5001），即机器 B 的 5001
      ES_PORT: "${ES_PORT:-5001}"
      ES_SCHEME: ${ES_SCHEME:-http}
    env_file:
      - .env
    restart: always
